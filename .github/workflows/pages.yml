# Bygger tidtabellsdata från Trafiklab varje natt och publicerar sidan på GitHub Pages.
name: Data och sida

on:
  schedule:
    - cron: "30 1 * * *" # 02:30/03:30 svensk tid
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Ladda ner GTFS högst en gång per dag så att Trafiklabs kvot räcker.
      - id: day
        run: echo "date=$(TZ=Europe/Stockholm date +%F)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: gtfs.zip
          key: gtfs-${{ steps.day.outputs.date }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          KEY: ${{ secrets.TRAFIKLAB_STATIC_KEY }}
        run: curl -fsSL --compressed -o gtfs.zip "https://opendata.samtrafiken.se/gtfs/dintur/dintur.zip?key=$KEY"
      - run: node scripts/build-data.mjs --zip gtfs.zip
      - name: Realtidsadress
        env:
          RT_API_URL: ${{ vars.RT_API_URL }}
        run: printf 'window.BUSS_CONFIG = { api: "%s" };\n' "$RT_API_URL" > public/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
