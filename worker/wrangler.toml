name = "buss-rt"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
OPERATOR = "dintur"
# Busskollens API som /api/* vidarebefordras till (reserv om Trafiklab inte svarar).
ORIGINAL_API = "https://ovik-live.andreasnordost.chatgpt.site"
# Sidor som får läsa från proxyn, kommaseparerade.
ALLOWED_ORIGINS = "https://andreasnordost-art.github.io"
# Cachetid i sekunder. Trafiklab Bronze ger 30 000 anrop i månaden för alla flöden
# tillsammans; med Silver kan bussarna sänkas till 15 och förseningarna till 30.
TTL_VEHICLES = "60"
TTL_UPDATES = "90"
TTL_ALERTS = "600"
